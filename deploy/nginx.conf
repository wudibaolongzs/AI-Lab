# Replace example.invalid and provision certificates before enabling.
# Include in nginx's http context. This is a small controlled trial template.
server {
    listen 80;
    access_log off;
    error_log /var/log/nginx/ict-error.log crit;
    server_name example.invalid;
    return 301 https://example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No raw URLs, query strings, credentials, or request bodies in gateway logs.
    access_log off;
    error_log /var/log/nginx/ict-error.log crit;
    client_max_body_size 4m; # materials JSON only; application retains 12KiB for existing APIs

    # Health is only reachable by local monitoring, with no authentication.
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Authorization "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Remote-User "";
    }

    # Applies to the page AND all APIs. Do not add unprotected API locations.
    location / {
        auth_basic "Private ICT trial";
        auth_basic_user_file /etc/ict-trial/htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Authorization "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 120s;
    }
}
